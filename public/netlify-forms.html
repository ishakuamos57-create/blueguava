<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BlueGuava form registration</title>
  </head>
  <body>
    <form name="blueguava-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="blueguava-contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="organization" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
